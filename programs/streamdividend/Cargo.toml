[package]
name = "streamdividend"
version = "0.1.0"
description = "StreamDividend — Solana dividend streaming vault (Stocklana hackathon)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "streamdividend"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
js-sys = "=0.3.69"
web-sys = "=0.3.69"
wasm-bindgen = "=0.2.92"  # newer wasm-bindgen uses std::panic::panic_any, cfg-gated out in the SBF stdlib  # pin: solana-program 1.18 needs implicit futures-util feature (dropped in newer js-sys)
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
proc-macro-crate = "=1.3.1"  # pin: v3 pulls toml_edit 0.25 (edition 2024), unsupported by SBF cargo
# NOTE: no direct `borsh` dep — anchor 0.29's prelude re-exports the borsh
# traits; a direct dep collides with them (E0659 ambiguous `AnchorSerialize`).
# solana-program is needed for invoke_signed/Instruction/Pubkey in token_ix.rs
# (anchor-lang depends on it but does not re-export the instruction module).
solana-program = "=1.17.14"
# SBF toolchain pins (SBF cargo 1.75 stops at edition-2021 manifests).
# Post-2025 releases of these transitive crates are edition 2024 and cannot
# be parsed. Each pin restores the last known-good version; they are already
# in the dep graph, so no extra code is compiled.
zeroize = "=1.3.0"            # keep; its zderive req is widened below
zeroize_derive = "=1.4.2"     # 1.5.0 is edition 2024 (SBF cargo 1.75 cannot parse)
blake3 = "=1.5.1"             # solana-program needs features [digest, traits-preview]; only 1.5.0/1.5.1 have them. 1.8.4+ pulls digest 0.11 (rust 1.85 chain)
# NOTE: cc/jobserver must NOT be direct deps here — they only belong in
# build-dependencies (host). A direct dep compiles them for SBF and cc's
# named-tempfile cfg fails on SBF.
indexmap = "=2.2.6"           # 2.14.2 -> hashbrown 0.17.1 (rust 1.85)
unicode-segmentation = "=1.12.0"  # 1.13.3 (rust 1.85)

# Deliberately NO anchor-spl / spl-token / spl-token-2022: the two token
# instructions the program needs (Transfer, InitializeAccount3) are hand-built
# in src/token_ix.rs. This keeps the SBF binary small (deploy rent is
# charged on program size) while remaining fully compatible with BOTH
# Token-v3 and Token-2022 mints (dispatch by mint owner).

[profile.release]
# overflow-checks=true adds per-op checks that push solana-program's
# AbiEnumVisitor match over SBF's 4096-byte stack limit on rustc 1.75 SBF.
overflow-checks = false
